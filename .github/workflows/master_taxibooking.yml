# Docs for the Azure Web Apps Deploy action:
# https://github.com/Azure/webapps-deploy

name: Build and deploy WAR app to Azure Web App - java-calculator-deployment

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java version
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'microsoft'

      - name: Build with Maven
        run: mvn clean install

      - name: Upload WAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: java-app
          path: '${{ github.workspace }}/target/*.war'


  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:

      - name: Download WAR artifact
        uses: actions/download-artifact@v4
        with:
          name: java-app


      - name: Login to Azure using OIDC
        uses: azure/login@v2
        with:
          client-id: 47709013-60dc-47bf-9424-67f64885052a
          tenant-id: 8758f94b-30a1-4c1b-93a4-f0f4aea2541e
          subscription-id: b4dcbaf7-5350-42af-9ff4-d8f3518df0cd


      - name: Deploy WAR to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: java-calculator-deployment
          slot-name: Production
          package: '*.war'
